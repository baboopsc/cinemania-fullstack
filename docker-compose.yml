# Tek komutla API + PostgreSQL: docker compose up --build
# API: http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cinemania
      POSTGRES_PASSWORD: cinemania
      POSTGRES_DB: cinemania
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinemania"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://cinemania:cinemania@db:5432/cinemania
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
